[project]
name = "fitmind-ai-backend"
version = "0.1.0"
description = "FitMind AI - Evidence-based fitness and nutrition intelligence agent"
requires-python = ">=3.11"

# Core dependencies - only what we need right now
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic-settings>=2.4.0",
    "python-dotenv>=1.0.0",
    "chromadb>=0.4.20",
    "google-genai>=0.2.0",
    "PyJWT>=2.8.0",
    "bcrypt>=4.0.0",
    "python-multipart>=0.0.6",
    "email-validator>=2.3.0",
    "alembic>=1.19.1",
    "sqlalchemy>=2.0.52",
    "gunicorn>=26.1.0",
    "slowapi>=0.1.10",
]

# Development dependencies - tools for testing and code quality
[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "ruff>=0.5.0",
    "pytest-mock>=3.10.0",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
