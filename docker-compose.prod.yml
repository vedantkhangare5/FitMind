version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    environment:
      - APP_ENV=production
      - FITMIND_DB_PATH=/data/fitmind.db
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - ALLOWED_ORIGINS=["https://${DOMAIN}"]
    volumes:
      - fitmind_data:/data
    networks:
      - fitmind_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: always
    environment:
      - NEXT_PUBLIC_API_URL=https://api.${DOMAIN}
    networks:
      - fitmind_network

  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - fitmind_network
    depends_on:
      - backend
      - frontend

volumes:
  fitmind_data:
  caddy_data:
  caddy_config:

networks:
  fitmind_network:
